<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Trabajos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Lista de trabajos -->
  <ion-list *ngIf="trabajos.length > 0">
    <ion-item *ngFor="let trabajo of trabajos">
      <ion-label>
        <h2>{{ trabajo.Nombre }}</h2>
      </ion-label>
      <ion-button fill="clear" (click)="abrirModalEditar(trabajo)">
        <ion-icon slot="icon-only" name="create"></ion-icon>
      </ion-button>
      <ion-button fill="clear" color="danger" (click)="eliminarTrabajo(trabajo.IdTrabajo)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Mensaje si no hay trabajos -->
  <div *ngIf="trabajos.length === 0" style="text-align: center; margin-top: 50px;">
    <p style="color: gray;">No hay trabajos registrados</p>
  </div>

  <!-- Botón flotante para agregar -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="abrirModalCrear()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal para crear/editar -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ isEditMode ? 'Editar Trabajo' : 'Nuevo Trabajo' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Nombre *</ion-label>
          <ion-input [(ngModel)]="trabajoActual.Nombre" placeholder="Nombre del trabajo"></ion-input>
        </ion-item>

        <ion-button expand="full" (click)="guardarTrabajo()" style="margin-top: 20px;">
          {{ isEditMode ? 'Actualizar' : 'Crear' }}
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
