<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Lista de usuarios -->
  <ion-list *ngIf="usuarios.length > 0">
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.Nombre }}</h2>
        <p>Usuario: {{ usuario.Usuario }}</p>
      </ion-label>
      <ion-button fill="clear" (click)="abrirModalEditar(usuario)">
        <ion-icon slot="icon-only" name="create"></ion-icon>
      </ion-button>
      <ion-button fill="clear" color="danger" (click)="eliminarUsuario(usuario.IdUsuario)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Mensaje si no hay usuarios -->
  <div *ngIf="usuarios.length === 0" style="text-align: center; margin-top: 50px;">
    <p style="color: gray;">No hay usuarios registrados</p>
  </div>

  <!-- Botón flotante para agregar -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="abrirModalCrear()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal para crear/editar -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ isEditMode ? 'Editar Usuario' : 'Nuevo Usuario' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Nombre *</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Nombre" placeholder="Nombre completo"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Usuario</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Usuario" placeholder="Nombre de usuario"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Clave" type="password" placeholder="Contraseña"></ion-input>
        </ion-item>

        <ion-button expand="full" (click)="guardarUsuario()" style="margin-top: 20px;">
          {{ isEditMode ? 'Actualizar' : 'Crear' }}
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
